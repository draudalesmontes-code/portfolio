# ── Required boilerplate. Connection-handling settings live here; empty is fine. ──
events {

}

# ── All web/proxy config must live inside the http block. ──
http {
  server_tokens off;
  client_max_body_size 1m;

  # Trust only private network hops (Caddy/Docker) when recovering the
  # visitor IP used by access logs and rate limits.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Preserve HTTPS information supplied by Caddy in production, while
  # continuing to work when nginx is reached directly during local dev.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
  }

  limit_req_zone $binary_remote_addr zone=core_api_limit:10m rate=10r/s;
  map $uri $auth_limit_key {
    default "";
    ~^/api/auth/(login|register|resend-verification)$ $binary_remote_addr;
  }
  map $uri $feedback_limit_key {
    default "";
    /api/feedback $binary_remote_addr;
  }
  map $uri $game_limit_key {
    default "";
    ~^/api/games/ $binary_remote_addr;
  }
  limit_req_zone $auth_limit_key zone=auth_limit:10m rate=10r/m;
  limit_req_zone $feedback_limit_key zone=feedback_limit:10m rate=5r/m;
  limit_req_zone $game_limit_key zone=game_limit:10m rate=30r/m;

  # ── Upstreams: a nickname for each backend = Docker service-name:port. ──
  # The host (e.g. "core-api") is the Compose SERVICE NAME; Docker's DNS
  # resolves it to that container's current IP.
  upstream core-api {
    server core-api:8080;
  }
  upstream ai-service {
    server ai-service:8000;
  }
  upstream frontend {
    server frontend:3000;
  }

  # ── The public front door: nginx listens here, routes by URL path. ──
  server {
    listen 80;

    # /api/* → Spring Boot. Trailing slash on proxy_pass STRIPS "/api",
    #   so /api/health reaches the backend as /health.
    location /api/ {
      limit_req zone=core_api_limit burst=20 nodelay;
      limit_req zone=auth_limit burst=5 nodelay;
      limit_req zone=feedback_limit burst=3 nodelay;
      limit_req zone=game_limit burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://core-api/;
      proxy_set_header Host            $host;                        # original domain the visitor asked for
      proxy_set_header X-Real-IP       $remote_addr;                 # the visitor's real IP
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # trail of every hop the request passed through
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # /ai/* → FastAPI. FastAPI owns the /ai prefix, so preserve the path.
    location /ai/ {
      proxy_pass http://ai-service;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_buffer_size        32k;
      proxy_buffers            8 32k;
      proxy_busy_buffers_size  64k;
      proxy_buffering          off;
    }

    # Everything else → Next.js frontend. No prefix to strip.
    location / {
      proxy_pass http://frontend/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }
}
