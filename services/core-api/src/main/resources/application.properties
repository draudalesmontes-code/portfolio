spring.application.name=portfolio
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/portfolio}
spring.datasource.username=${DB_USERNAME:folioAdmin}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl_auto=none
spring.jackson.deserialization.fail-on-unknown-properties=true
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
app.jwt.secret = ${JWT_SECRET}
app.jwt.expiry-ms=86400000
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.resend.api-key=${RESEND_API_KEY}
app.resend.from=${RESEND_FROM}
app.base-url=${BASE_URL}
